[package]
name = "comfyneko-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "comfyneko_core"
path = "src/lib.rs"

[[bin]]
name = "comfyneko"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png", "tiff", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "runtime-tokio-rustls", "sqlite", "uuid"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
