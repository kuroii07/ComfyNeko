[package]
name = "comfyneko-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "comfyneko_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
